<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단: 로고, 카페 이름, 부제 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p class="subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- 탭 메뉴 -->
  <nav class="tabs">
    <button type="button" class="tab active" id="tab-btn-order" data-tab="tab-order">☕ 주문하기</button>
    <button type="button" class="tab" id="tab-btn-history" data-tab="tab-history">📋 주문 내역 <span id="order-count" class="badge">0</span></button>
  </nav>

  <main>
    <!-- 주문하기 탭 -->
    <section id="tab-order">
    <!-- 주문서 폼 (필수 검사는 JavaScript에서 처리하므로 novalidate 사용) -->
    <form id="order-form" novalidate>

      <!-- 1. 이름 (필수) -->
      <div class="form-group">
        <label for="name">이름 (필수)</label>
        <input type="text" id="name" name="name" required>
      </div>

      <!-- 2. 전화번호 -->
      <div class="form-group">
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <!-- 2-1. 스탬프 카드 (전화번호를 입력하면 script.js가 채움) -->
      <div id="stamp-card" class="stamp-card">
        <div id="stamp-title" class="stamp-title"></div>
        <div id="stamp-grid" class="stamp-grid"></div>
        <label id="redeem-label" class="redeem-label hidden">
          <input type="checkbox" id="redeem-free">
          🎁 스탬프 10개 사용하고 음료 1잔 무료!
        </label>
      </div>

      <!-- 3. 음료 선택 -->
      <div class="form-group">
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <optgroup label="☕ 커피">
            <option value="espresso" data-price="2500">에스프레소 2,500원</option>
            <option value="americano" data-price="3500">아메리카노 3,500원</option>
            <option value="honey-americano" data-price="4000">꿀아메리카노 4,000원</option>
            <option value="coldbrew" data-price="4000">콜드브루 4,000원</option>
            <option value="coldbrew-latte" data-price="4500">콜드브루라떼 4,500원</option>
            <option value="latte" data-price="4000">카페라떼 4,000원</option>
            <option value="cappuccino" data-price="4000">카푸치노 4,000원</option>
            <option value="mocha" data-price="4500">카페모카 4,500원</option>
            <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
            <option value="hazelnut-latte" data-price="4500">헤이즐넛라떼 4,500원</option>
            <option value="condensed-latte" data-price="4500">연유라떼 4,500원</option>
            <option value="caramel-macchiato" data-price="4800">카라멜마키아토 4,800원</option>
            <option value="original-coffee" data-price="3000">원조커피 3,000원</option>
          </optgroup>
          <optgroup label="🥛 라떼 (논커피)">
            <option value="greentea-latte" data-price="4500">녹차라떼 4,500원</option>
            <option value="choco-latte" data-price="4500">초코라떼 4,500원</option>
            <option value="grain-latte" data-price="4500">곡물라떼 4,500원</option>
            <option value="sweetpotato-latte" data-price="4800">고구마라떼 4,800원</option>
            <option value="strawberry-latte" data-price="4800">딸기라떼 4,800원</option>
            <option value="toffeenut-latte" data-price="4800">토피넛라떼 4,800원</option>
            <option value="milktea" data-price="4200">밀크티 4,200원</option>
          </optgroup>
          <optgroup label="🥤 스무디 · 프라페">
            <option value="cookie-frappe" data-price="4800">쿠키프라페 4,800원</option>
            <option value="mintchoco-frappe" data-price="4800">민트초코프라페 4,800원</option>
            <option value="coffee-frappe" data-price="4500">커피프라페 4,500원</option>
            <option value="yogurt-smoothie" data-price="4500">플레인요거트스무디 4,500원</option>
            <option value="mango-smoothie" data-price="4800">망고스무디 4,800원</option>
            <option value="blueberry-smoothie" data-price="4800">블루베리요거트스무디 4,800원</option>
            <option value="strawberry-smoothie" data-price="4800">딸기스무디 4,800원</option>
            <option value="choco-smoothie" data-price="4500">초코스무디 4,500원</option>
          </optgroup>
          <optgroup label="🍋 에이드 · 주스">
            <option value="lemonade" data-price="4000">레몬에이드 4,000원</option>
            <option value="grapefruit-ade" data-price="4300">자몽에이드 4,300원</option>
            <option value="greengrape-ade" data-price="4300">청포도에이드 4,300원</option>
            <option value="yuja-ade" data-price="4300">유자에이드 4,300원</option>
            <option value="lime-mojito" data-price="4300">라임모히토 4,300원</option>
            <option value="cherry-coke" data-price="3500">체리콕 3,500원</option>
            <option value="peach-icetea" data-price="3500">복숭아아이스티 3,500원</option>
            <option value="orange-juice" data-price="4500">오렌지주스 4,500원</option>
          </optgroup>
          <optgroup label="🍵 차">
            <option value="chamomile" data-price="3000">캐모마일 3,000원</option>
            <option value="peppermint" data-price="3000">페퍼민트 3,000원</option>
            <option value="earlgrey" data-price="3000">얼그레이 3,000원</option>
            <option value="yuja-tea" data-price="3800">유자차 3,800원</option>
            <option value="lemon-tea" data-price="3800">레몬차 3,800원</option>
            <option value="grapefruit-tea" data-price="4000">자몽차 4,000원</option>
            <option value="omija-tea" data-price="4000">오미자차 4,000원</option>
          </optgroup>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오, M이 기본 선택) -->
      <fieldset class="form-group">
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S (+0원)</label>

        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M (+500원)</label>

        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L (+1,000원)</label>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset class="form-group">
        <legend>추가 옵션</legend>
        <input type="checkbox" id="opt-shot" name="option" value="샷 추가" data-price="500">
        <label for="opt-shot">샷 추가 (+500원)</label>

        <input type="checkbox" id="opt-cream" name="option" value="크림 추가" data-price="500">
        <label for="opt-cream">크림 추가 (+500원)</label>

        <input type="checkbox" id="opt-syrup" name="option" value="시럽 추가" data-price="300">
        <label for="opt-syrup">시럽 추가 (+300원)</label>

        <input type="checkbox" id="opt-decaf" name="option" value="디카페인" data-price="0">
        <label for="opt-decaf">디카페인 (+0원)</label>
      </fieldset>

      <!-- 6. 수량 -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 -->
      <div class="form-group">
        <label for="request">요청사항</label>
        <textarea id="request" name="request" rows="4"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="total-price" class="total-price">예상 금액: 0원</div>

      <!-- 9, 10. 버튼 -->
      <div class="buttons">
        <button type="submit" id="order-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지 영역 (처음에는 숨김) -->
    <div id="order-result" class="order-result" hidden></div>
    </section>

    <!-- 주문 내역 탭 (처음에는 숨김) -->
    <section id="tab-history" class="hidden">
      <!-- 주문이 없을 때 안내 -->
      <p id="empty-message" class="empty-message">아직 주문 내역이 없어요 ☕</p>
      <!-- 주문 카드 목록 (renderOrders가 채움) -->
      <div id="order-list"></div>
      <!-- 합계와 전체 삭제 -->
      <div id="history-footer" class="history-footer hidden">
        <div id="history-total" class="history-total"></div>
        <button type="button" id="clear-btn" class="clear-btn">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase 라이브러리 (script.js보다 먼저 불러와야 함) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
